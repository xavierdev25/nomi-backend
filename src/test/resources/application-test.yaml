spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nomi_db
    driver-class-name: org.postgresql.Driver
    username: nomi_user
    password: ${DB_PASSWORD:test_db_password_placeholder}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  docker:
    compose:
      lifecycle-management: none
  data:
    redis:
      host: localhost
      port: 6380
  cache:
    type: none

logging:
  level:
    root: WARN
    com.nomi.backend: INFO
    org.flywaydb: INFO

jwt:
  secret: ${JWT_SECRET:test_jwt_secret_placeholder_minimum_32_bytes_long_value}
  expiration: 86400000
  refresh-expiration: 604800000
  issuer: nomi-backend

mercadopago:
  access-token: TEST-placeholder
  public-key: TEST-placeholder
  webhook-secret: placeholder
  notification-url: http://localhost:8080/api/payments/webhook

cloudinary:
  cloud-name: placeholder
  api-key: placeholder
  api-secret: placeholder
