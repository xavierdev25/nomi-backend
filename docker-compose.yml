# =============================================
# Nomi Backend — Docker Compose
# =============================================
version: "3.9"

services:
  # ── PostgreSQL 16 ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nomi-network

  redis:
    image: redis:7-alpine
    container_name: nomi-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - nomi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nomi AI Service ─────────────────────
  ai-service:
    build:
      context: ../nomi-ai-service
      dockerfile: Dockerfile
    container_name: nomi-ai-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AI_SERVICE_PORT: 8001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      API_SECRET_KEY: ${AI_SERVICE_SECRET_KEY:?AI_SERVICE_SECRET_KEY is required}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: redis://nomi-redis:6379
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-300}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nomi-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  nomi-network:
    driver: bridge
