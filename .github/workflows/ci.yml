name: Nomi Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nomi_db
          POSTGRES_USER: nomi_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_db_password_placeholder' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Correr verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nomi_db
          DB_USERNAME: nomi_user
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_db_password_placeholder' }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_jwt_secret_placeholder_min_32_bytes' }}
          JWT_EXPIRATION: 86400000
          JWT_REFRESH_EXPIRATION: 604800000
          JWT_ISSUER: nomi-backend
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.CI_MERCADOPAGO_ACCESS_TOKEN || 'ci_mercadopago_access_token_placeholder' }}
          MERCADOPAGO_PUBLIC_KEY: ${{ secrets.CI_MERCADOPAGO_PUBLIC_KEY || 'ci_mercadopago_public_key_placeholder' }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.CI_MERCADOPAGO_WEBHOOK_SECRET || 'ci_mercadopago_webhook_secret_placeholder' }}
          MERCADOPAGO_NOTIFICATION_URL: http://localhost:8080/api/payments/webhook
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CI_CLOUDINARY_CLOUD_NAME || 'ci_cloudinary_cloud_name_placeholder' }}
          CLOUDINARY_API_KEY: ${{ secrets.CI_CLOUDINARY_API_KEY || 'ci_cloudinary_api_key_placeholder' }}
          CLOUDINARY_API_SECRET: ${{ secrets.CI_CLOUDINARY_API_SECRET || 'ci_cloudinary_api_secret_placeholder' }}
          AI_SERVICE_URL: http://localhost:8001
          SPRING_PROFILES_ACTIVE: dev
        run: ./mvnw verify --no-transfer-progress

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Build sin tests
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomi-backend-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nomi-backend:latest .

      - name: Save Docker image
        run: docker save nomi-backend:latest | gzip > nomi-backend.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: nomi-backend.tar.gz
          retention-days: 1

  trivy-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < nomi-backend.tar.gz

      - name: Run Trivy scan
        # Fijado a un commit (v0.36.0): una rama o una etiqueta móvil puede cambiar sin aviso.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nomi-backend:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
