# =============================================
# Nomi Backend — Spring Boot Configuration
# =============================================
spring:
  application:
    name: nomi-backend
  profiles:
      active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── PostgreSQL DataSource ──────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nomi_db}
    username: ${DB_USERNAME:nomi_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway Migrations ─────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ── Docker Compose Integration ─────────────
  docker:
    compose:
      lifecycle-management: start-only
      file: docker-compose.yml

  # ── Servlet / Multipart ────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ── Redis Cache ────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000

# ── Server ─────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# ── JWT Configuration ──────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}        # 24 hours (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days (ms)
  issuer: ${JWT_ISSUER:nomi-backend}

# ── Cloudinary ─────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ── MercadoPago ────────────────────────────
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  public-key: ${MERCADOPAGO_PUBLIC_KEY}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/api/payments/webhook}

# ── WebSocket (STOMP over SockJS) ─────────
websocket:
  allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  endpoint: /ws
  topic-prefix: /topic
  app-prefix: /app

# ── Logging ────────────────────────────────
logging:
  level:
    root: INFO
    com.nomi.backend: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_LOG_LEVEL:WARN}
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

# ── CORS ───────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# ── AI Service ─────────────────────────────
nomi:
  orders:
    # Tiempo para pagar un pedido; después se cancela y su stock vuelve a estar disponible.
    payment-window-minutes: ${ORDER_PAYMENT_WINDOW_MINUTES:15}
    # Pedidos sin pagar que puede tener un estudiante a la vez.
    max-pending-per-user: ${ORDER_MAX_PENDING_PER_USER:2}
    # Cada cuánto se concilian los pedidos pendientes con MercadoPago y se cancelan los vencidos.
    reconcile-interval-ms: ${ORDER_RECONCILE_INTERVAL_MS:60000}
    # Cada cuánto se buscan pagos aprobados de pedidos ya cancelados (para reembolsarlos), y
    # durante cuántas horas desde la cancelación.
    late-payment-check-interval-ms: ${ORDER_LATE_PAYMENT_CHECK_INTERVAL_MS:600000}
    late-payment-window-hours: ${ORDER_LATE_PAYMENT_WINDOW_HOURS:72}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8001}
    secret-key: ${AI_SERVICE_SECRET_KEY:}

# ── SpringDoc / Swagger ────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

# ── Actuator ───────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ── Info ───────────────────────────────────
info:
  app:
    name: Nomi Backend
    version: 1.0.0
    description: Sistema de delivery universitario Nomi
    java-version: "21"
    spring-boot-version: "4.0.8"

# ── Firebase FCM ───────────────────────────
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
